
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Guerrilla · La Grieta del Mundo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="c"></canvas>
  
  <!-- Barra superior estilo AoE 2 -->
  <div id="top">
    <div id="res"></div>
    <div id="mu" onclick="setMute()" style="cursor:pointer; margin-left:auto;">🔊</div>
  </div>
  
  <!-- Interfaz central / Minimapa e Información -->
  <div style="position:fixed; top:54px; left:10px; display:flex; flex-direction:column; gap:6px; z-index:5; pointer-events:none;">
    <canvas id="mm" width="120" height="120" style="pointer-events:auto; border:2px solid #8c6f3d; border-radius:4px; background:#100d16;"></canvas>
  </div>

  <div id="inf" style="position:fixed; top:54px; left:140px; right:10px; background:rgba(28,20,32,0.9); border:2px solid #8c6f3d; border-radius:4px; padding:8px 12px; font-size:13px; z-index:5; pointer-events:none; display:flex; flex-direction:column; gap:2px;"></div>

  <!-- Panel de comandos inferior estilo AoE 2 -->
  <div id="bot">
    <canvas id="pt" width="64" height="64" style="border:2px solid #8c6f3d; border-radius:4px; background:#100d16; flex-shrink:0;"></canvas>
    <div id="cmd" style="display:flex; gap:6px; overflow-x:auto; flex-grow:1; align-items:center;"></div>
  </div>

  <!-- Menú principal -->
  <div id="menu"></div>

  <!-- Pantalla de Introducción Cinemática -->
  <div id="intro" hidden style="position:fixed; inset:0; background:#0c0a0f; z-index:1000; display:flex; flex-direction:column; align-items:center; justify-content:center;">
    <canvas id="ic" style="position:absolute; inset:0; width:100%; height:100%; z-index:1;"></canvas>
    <div id="it" style="position:relative; z-index:2; max-width:680px; padding:20px; font-size:20px; text-align:center; color:#f0e6d2; text-shadow:0 2px 4px #000; margin-bottom:100px;"></div>
    <button id="skip" style="position:absolute; top:20px; right:20px; z-index:3;">Saltar</button>
    <button id="go" style="position:relative; z-index:3; font-size:18px; padding:12px 24px;">▶ Toca para comenzar</button>
  </div>

  <!-- Scripts del motor del juego -->
  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/art.js"></script>
  <script src="js/intro.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
